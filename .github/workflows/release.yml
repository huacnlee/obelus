# What a tag produces: an archive of `ob` per platform, a `.deb`, a `.rpm`,
# and a GitHub release with all of it on it.
#
# The archives are what `contrib/install.sh`, `contrib/install.ps1` and
# mise's `github:` backend fetch, so their names -- `ob-<version>-<target>`
# -- are read by all three and are not this file's alone to change.
name: Release

on:
  push:
    tags: ['v*']
  # A rehearsal. It builds everything and uploads it as workflow artifacts,
  # and publishes nothing -- the `publish` job below is gated on a tag.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: The version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.said.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # A tag and the version in `Cargo.toml` are one fact written twice, so
      # this is the test that the one reads the other. Said here, once,
      # rather than at the end: a mismatch found after eight builds is eight
      # builds nobody needed.
      - id: said
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "obelus-cli") | .version')
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            tag=${GITHUB_REF#refs/tags/}
            if [[ $tag != "v$version" ]]; then
              echo "::error::the tag is $tag and Cargo.toml says $version, so one of them is wrong"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

  build:
    name: ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            # The two that a distribution has a format of its own for.
            distro: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            distro: true
          # Static, for a system whose libc is not glibc.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            exe: .exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            exe: .exe
    steps:
      - uses: actions/checkout@v7

      # The fifteen grammars are C compiled by their build scripts, so a
      # musl target needs a musl C compiler. `cc` reaches for `musl-gcc` by
      # itself once it is installed.
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build --profile dist --locked --target ${{ matrix.target }} -p obelus-cli

      # One directory, named the way the archive is, so that unpacking it in
      # a downloads folder puts nothing loose in it.
      - name: Lay the archive out
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging archives
          name="ob-${{ needs.plan.outputs.version }}-${{ matrix.target }}"
          mkdir -p "staging/$name"
          cp "target/${{ matrix.target }}/dist/ob${{ matrix.exe }}" "staging/$name/"
          cp README.md LICENSE "staging/$name/"
          echo "$name" >> staging/names

      # xz rather than gzip. Nothing is stripped -- a release build has no
      # debug info to begin with, so the symbol table is the whole of what a
      # panic in somebody's log has to read -- which leaves these binaries
      # at forty to sixty megabytes, and that is where the difference
      # between the two is worth a reader's minute.
      - name: Pack it (tar)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          while read -r name; do
            tar -C staging -cJf "archives/$name.tar.xz" "$name"
          done < staging/names

      # A zip, because a Windows reader has one and may not have a tar. Its
      # own step rather than a branch inside the one above: bsdtar and the
      # tar Git for Windows installs disagree about how to make a zip, and
      # PowerShell is the one thing on that runner that is not a choice.
      - name: Pack it (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($name in Get-Content staging/names) {
            Compress-Archive -Path "staging/$name" -DestinationPath "archives/$name.zip"
          }

      # What a distribution installs. `--no-build` because the binaries are
      # the ones built above: building them twice would be building them
      # differently, and the whole point of a release is that everything in
      # it came out of one compile.
      #
      # `dpkg-dev` is on the runner, so cargo-deb asks it what the binary
      # actually links and writes that into Depends rather than guessing.
      # One comes down as a binary and the other is compiled, because
      # cargo-generate-rpm publishes no releases to fetch.
      - if: matrix.distro
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - if: matrix.distro
        run: cargo install cargo-generate-rpm --locked

      - name: A .deb and a .rpm
        if: matrix.distro
        shell: bash
        run: |
          set -euo pipefail
          cargo deb --no-build --target ${{ matrix.target }} --profile dist \
            -p obelus-cli --output archives/
          cargo generate-rpm --target ${{ matrix.target }} --profile dist \
            -p crates/obelus-cli --output archives/

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: archives/*
          if-no-files-found: error

  # Each half of the Mac binary on a runner of its own. The two compiles
  # one after the other were the longest job in a release, and `lipo` needs
  # only the two files side by side, not the two builds. Both on an arm
  # runner: the Intel half is cross-compiled, as it always was.
  macos-half:
    name: ${{ matrix.target }}
    needs: plan
    runs-on: macos-15
    timeout-minutes: 90
    # One half is no use without the other, so a failure in either stops
    # both -- which is the default, and why this matrix does not say
    # `fail-fast: false` as the one above does.
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build --profile dist --locked --target ${{ matrix.target }} -p obelus-cli

      # `macos-` is what keeps these out of the release: see `publish`.
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.target }}
          path: target/${{ matrix.target }}/dist/ob
          if-no-files-found: error
          retention-days: 1

  macos:
    # One archive for both architectures, so a reader on a Mac is never
    # asked which one they have.
    name: universal2-apple-darwin
    needs: [plan, macos-half]
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-*
          path: halves

      - name: Make one binary of the two
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging archives
          name="ob-${{ needs.plan.outputs.version }}-universal2-apple-darwin"
          mkdir -p "staging/$name"
          lipo -create -output "staging/$name/ob" \
            "halves/macos-aarch64-apple-darwin/ob" \
            "halves/macos-x86_64-apple-darwin/ob"
          # An artifact is a zip and keeps no file modes, so what came
          # down is not executable, and nor is what `lipo` made of it.
          chmod +x "staging/$name/ob"

          # An arm64 binary macOS will not run at all is one with no
          # signature, and rustc's linker signs the arm64 build itself --
          # which joining the two throws away. `-` is the ad-hoc identity:
          # no certificate, nothing notarised, and the one thing needed
          # for the thing to start. A reader who downloads this in a
          # browser still meets Gatekeeper, because a browser marks what
          # it saved as quarantined; `curl` and `mise` do not.
          codesign --force --sign - "staging/$name/ob"
          codesign --verify --verbose "staging/$name/ob"

          cp README.md LICENSE "staging/$name/"
          tar -C staging -cJf "archives/$name.tar.xz" "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: universal2-apple-darwin
          path: archives/*
          if-no-files-found: error

  publish:
    name: The release
    needs: [plan, build, macos]
    # A rehearsal leaves its archives as workflow artifacts and stops here.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # Everything but the two halves of the Mac binary, which are only on
      # their way into `universal2-apple-darwin`. A leading `!` turns the
      # pattern round.
      - uses: actions/download-artifact@v8
        with:
          pattern: '!macos-*'
          path: assets
          merge-multiple: true

      # The assets that are not built: omarchy's template, and the desktop
      # entry and icon that put `ob` in a Linux launcher -- all fetched by
      # `contrib/install.sh`. Here rather than read from the
      # repository at install time so that they are covered by the sums
      # below -- everything that script downloads is checked against what
      # the release says it is, and a text file is no exception.
      - run: cp contrib/omarchy/obelus.toml.tpl contrib/desktop/obelus-terminal.desktop contrib/desktop/obelus.svg assets/

      # One file for all of them, because that is what an installer reads:
      # a formula, a manifest and `contrib/install.sh` each want the sum of
      # one archive, and none of them wants to fetch it to work it out.
      - name: Say what each of them is
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          # A pattern that matches nothing expands to nothing rather than to
          # itself, so a platform dropped from the matrix is one fewer line
          # here and not a failure.
          shopt -s nullglob
          sha256sum -- *.tar.xz *.zip *.deb *.rpm *.tpl *.desktop *.svg > SHA256SUMS
          cat SHA256SUMS

      # A draft. The tag is the decision to build; publishing is the
      # decision to tell people, and that one is a reader's to make -- which
      # is also what an installer's automation hangs on, since a release
      # being published is an event and a draft being created is not.
      - name: Hand them to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=${GITHUB_REF#refs/tags/}
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" assets/* --clobber
          else
            gh release create "$tag" assets/* --draft --generate-notes --title "$tag"
          fi
